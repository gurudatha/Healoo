# Internet profile: Caddy terminates TLS with Let's Encrypt for API_DOMAIN and FILES_DOMAIN.
#   cp .env.internet.example .env   (fill in domains, Auth0, secrets)
#   docker compose up -d --build
# Only Caddy publishes ports (80/443). Everything else stays on the private network.

name: healoo-internet

x-app-env: &app-env
  NETWORK_MODE: internet
  PUBLIC_BASE_URL: https://${API_DOMAIN:?set API_DOMAIN}/
  BIND: 0.0.0.0:8080
  TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8
  CASSANDRA_NODES: cassandra:9042
  KAFKA_BROKERS: kafka:9092
  EVENT_BUS: kafka
  AUTH_MODE: auth0
  AUTH0_DOMAIN: ${AUTH0_DOMAIN:?set AUTH0_DOMAIN}
  AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.careconnect.local}
  CLAIMS_NAMESPACE: ${CLAIMS_NAMESPACE:-https://careconnect.local/}
  FILE_STORE: s3
  S3_BUCKET: careconnect
  S3_ENDPOINT: http://storage:8333
  S3_PUBLIC_ENDPOINT: https://${FILES_DOMAIN:?set FILES_DOMAIN}
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  DEBUG_ROUTES: "false"
  RUST_LOG: ${RUST_LOG:-info}

services:
  cassandra:
    image: cassandra:5.0
    environment: { MAX_HEAP_SIZE: 1G, HEAP_NEWSIZE: 256M, CASSANDRA_CLUSTER_NAME: careconnect }
    volumes: [cassandra_data:/var/lib/cassandra]
    healthcheck: { test: ["CMD", "cqlsh", "-e", "describe keyspaces"], interval: 15s, timeout: 10s, retries: 20 }
    restart: unless-stopped

  cassandra-init:
    image: cassandra:5.0
    depends_on: { cassandra: { condition: service_healthy } }
    volumes: [../../db/schema.cql:/schema.cql:ro]
    entrypoint: ["sh", "-c", "until cqlsh cassandra -f /schema.cql; do sleep 5; done"]
    restart: "no"

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms512M"
    volumes: [kafka_data:/var/lib/kafka/data]
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on: [kafka]
    volumes: [../../kafka/create-topics.sh:/create-topics.sh:ro]
    entrypoint: ["sh", "/create-topics.sh"]
    restart: "no"

  # Object storage: SeaweedFS (Apache-2.0) with its S3-compatible gateway on port 8333.
  # The server only uses the standard S3 protocol, so any S3-compatible store works here
  # (set S3_ENDPOINT and the two keys). No bucket setup is needed: the bucket is created on the
  # first upload, and everything is private; files are reached only through signed links.
  storage:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    # Writes the one S3 identity from the two keys, then starts master, volume, filer and S3.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"healoo","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec /entrypoint.sh server -filer -s3 -s3.config=/tmp/s3.json -s3.iam=false -s3.port.iceberg=0 -s3.port.lance=0 -ip=storage -ip.bind=0.0.0.0
    volumes: [storage_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  care-api:
    build: { context: ../.., target: api }
    environment: { <<: *app-env, INSTANCE_ID: api-1 }
    depends_on:
      cassandra-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
      storage: { condition: service_healthy }
    restart: unless-stopped

  care-worker:
    build: { context: ../.., target: worker }
    environment: *app-env
    depends_on:
      cassandra-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
      storage: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: { API_DOMAIN: "${API_DOMAIN}", FILES_DOMAIN: "${FILES_DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}" }
    volumes: [../../proxy/Caddyfile.internet:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [care-api, storage]
    restart: unless-stopped

volumes: { cassandra_data: {}, kafka_data: {}, storage_data: {}, caddy_data: {}, caddy_config: {} }
