# LAN trial profile: phones/emulators on the same Wi-Fi talk to https://<HOST_LAN_IP>:8443
#   cp .env.lan.example .env   (set HOST_LAN_IP)
#   docker compose up -d --build
# Cassandra, Kafka and Kafka UI are bound to 127.0.0.1 only; only care-api is on the LAN.

name: healoo-lan

x-app-env: &app-env
  NETWORK_MODE: lan
  CASSANDRA_NODES: cassandra:9042
  KAFKA_BROKERS: kafka:9092
  EVENT_BUS: kafka
  FILE_STORE: disk
  FILES_DIR: /data/files
  TLS_DIR: /data/tls
  AUTH_MODE: ${AUTH_MODE:-dev}
  DEV_JWT_SECRET: ${DEV_JWT_SECRET:-healoo-dev-secret-change-me}
  FILES_SECRET: ${FILES_SECRET:-healoo-files-secret-change-me}
  AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
  AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.careconnect.local}
  PUBLIC_BASE_URL: https://${HOST_LAN_IP:?set HOST_LAN_IP in .env}:8443/
  RUST_LOG: ${RUST_LOG:-info,care_api=debug}

services:
  cassandra:
    image: cassandra:5.0
    environment: { MAX_HEAP_SIZE: 1G, HEAP_NEWSIZE: 256M, CASSANDRA_CLUSTER_NAME: careconnect }
    ports: ["127.0.0.1:9042:9042"]
    volumes: [cassandra_data:/var/lib/cassandra]
    healthcheck: { test: ["CMD", "cqlsh", "-e", "describe keyspaces"], interval: 15s, timeout: 10s, retries: 20 }

  cassandra-init:
    image: cassandra:5.0
    depends_on: { cassandra: { condition: service_healthy } }
    volumes: [../../db/schema.cql:/schema.cql:ro]
    entrypoint: ["sh", "-c", "until cqlsh cassandra -f /schema.cql; do echo retrying schema; sleep 5; done"]
    restart: "no"

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms512M"
    ports: ["127.0.0.1:29092:29092"]   # for running care-api natively with KAFKA_BROKERS=localhost:29092
    volumes: [kafka_data:/var/lib/kafka/data]

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on: [kafka]
    volumes: [../../kafka/create-topics.sh:/create-topics.sh:ro]
    entrypoint: ["sh", "/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    environment: { KAFKA_CLUSTERS_0_NAME: healoo, KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092" }
    ports: ["127.0.0.1:8081:8080"]

  care-api:
    build: { context: ../.., target: api }
    environment:
      <<: *app-env
      LAN_TLS: builtin
      BIND: 0.0.0.0:8443
      MDNS: "false"          # multicast doesn't leave the Docker bridge; run natively for mDNS
      INSTANCE_ID: api-1
    ports: ["8443:8443"]     # the only port phones need
    volumes: [app_data:/data]
    depends_on:
      cassandra-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  care-worker:
    build: { context: ../.., target: worker }
    environment: *app-env
    volumes: [app_data:/data]
    depends_on:
      cassandra-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  care-seed:
    build: { context: ../.., target: worker }
    command: ["care-seed"]
    environment: *app-env
    volumes: [app_data:/data]
    depends_on:
      cassandra-init: { condition: service_completed_successfully }
    restart: "no"

volumes: { cassandra_data: {}, kafka_data: {}, app_data: {} }
