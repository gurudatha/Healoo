# Nginx equivalent of Caddyfile.internet (design doc 9.3). Certificates from certbot.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream care_api { server care-api:8080; keepalive 32; }

server {
  listen 443 ssl;
  http2 on;
  server_name api.example.com;
  ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
  client_max_body_size 20m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  server_tokens off;

  location /v1/ws {
    proxy_pass http://care_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }
  location = /ws {
    proxy_pass http://care_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }
  location /v1/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://care_api;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /healthz { proxy_pass http://care_api; }
  location / { return 404; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name files.example.com;
  ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;
  client_max_body_size 26m;
  location / {
    proxy_pass http://minio:9000;
    proxy_set_header Host $host;          # must match the presigned host
  }
}

server { listen 80; server_name _; return 301 https://$host$request_uri; }
