# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: Healoo
options:
  bundleIdPrefix: com.healoo
  deploymentTarget:
    iOS: "17.0"
# Personal: a Debug build for Xcode's free "Personal Team" on your own iPhone (no push, own bundle
# ID; team from Configs/Local.xcconfig). Use the "Healoo Personal Team" scheme. See WUI/README.md.
configs:
  Debug: debug
  Release: release
  Personal: debug
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.4"
    CURRENT_PROJECT_VERSION: "4"
packages:
  Auth0:
    url: https://github.com/auth0/Auth0.swift
    from: 2.10.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.2.0
targets:
  Healoo:
    type: application
    platform: iOS
    # A shared "Healoo" scheme, so `xcodebuild -scheme Healoo` also works on CI (.github/workflows).
    scheme: {}
    sources:
      - path: Healoo
      # Bottom-bar operations per page, shared with Android (read by Components/OperationBar.swift).
      - path: ../page-operations.json
        buildPhase: resources
    dependencies:
      - package: Auth0
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: Healoo/Healoo.entitlements
      properties:
        # Push: "development" for Debug builds, "production" for Release (App Store, TestFlight,
        # Ad Hoc); the provisioning profile must match, or signing fails.
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healoo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
        Personal:
          # Personal teams can't use the Push Notifications capability: sign without entitlements
          # (push registration then just fails quietly; everything else works).
          CODE_SIGN_ENTITLEMENTS: ""
          # com.healoo.app may already be registered by someone else; the team ID makes it unique.
          PRODUCT_BUNDLE_IDENTIFIER: com.healoo.app.dev.$(DEVELOPMENT_TEAM)
          CODE_SIGN_STYLE: Automatic
    configFiles:
      # DEVELOPMENT_TEAM comes from Configs/Local.xcconfig (not in git), via Personal.xcconfig.
      Personal: Configs/Personal.xcconfig
    info:
      path: Healoo/Info.plist
      properties:
        CFBundleDisplayName: Healoo
        UILaunchScreen:
          UIColorName: ""
        UIAppFonts:
          - Fraunces-SemiBold.ttf
          - Figtree-Regular.ttf
          - Figtree-Medium.ttf
          - Figtree-SemiBold.ttf
        NSCameraUsageDescription: Healoo uses the camera to photograph reports and to scan Healoo ID QR codes.
        UIBackgroundModes: [remote-notification]
        # Firebase: we set the APNs token ourselves
        FirebaseAppDelegateProxyEnabled: false
        # Auth0 callback: com.healoo.app://<domain>/ios/com.healoo.app/callback
        CFBundleURLTypes:
          - CFBundleURLName: auth0
            CFBundleURLSchemes: [$(PRODUCT_BUNDLE_IDENTIFIER)]
        # ---- Healoo settings ----
        # true = demo data + demo account picker; no backend or Auth0 needed
        HealooUseFakeData: true
        # Trial server from healoo-backend (LAN profile): https://<computer's LAN IP>:8443/
        HealooAPIBaseURL: https://localhost:8443/
        # Debug builds only: sign in as the trial server's test accounts (backend AUTH_MODE=dev)
        HealooDevSignIn: true
        # Auth0 (design doc 5). Leave empty to stay in demo mode.
        HealooAuth0Domain: ""
        HealooAuth0ClientId: ""
        HealooAuth0Audience: https://api.healoo.local
schemes:
  # Run on your own iPhone with Xcode's free Personal Team (see WUI/README.md, "iPhone with a
  # Personal Team"). Uses the Personal configuration.
  Healoo Personal Team:
    build:
      targets:
        Healoo: all
    run:
      config: Personal
    profile:
      config: Personal
    analyze:
      config: Personal
    archive:
      config: Personal
