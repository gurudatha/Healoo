org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Gradle 9 must run on JDK 17 or newer. If your PATH/JAVA_HOME still points at an older JDK
# (e.g. 11), point Gradle at JDK 17 in YOUR ~/.gradle/gradle.properties (not this file), e.g.:
#   org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.16.8-hotspot
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---- Healoo settings (override in ~/.gradle/gradle.properties to keep secrets out of git) ----
# true = seeded demo data + demo account picker, no backend or Auth0 needed
healoo.useFakeData=false
# Trial server from healoo-backend (LAN profile): https://<computer's LAN IP>:8443/
# The emulator can also use https://10.0.2.2:8443/
healoo.apiBaseUrl=https://192.168.1.4:8443/
# Debug builds only: sign in as the trial server's test accounts (backend AUTH_MODE=dev)
healoo.devSignIn=true
# Auth0 (design doc 5). Leave domain empty to stay in demo mode.
healoo.auth0.domain=
healoo.auth0.clientId=
healoo.auth0.audience=https://api.healoo.local
