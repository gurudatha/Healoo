# Builds the Healoo iPhone app (WUI/ios) on GitHub-hosted Macs.
#
# build-macos   Debug and Release for the iOS Simulator, on every change to the iOS app.
#               No Apple account needed. Artifact: "macos-executable".
# build-device  Signed Release build for real iPhones (.ipa), optionally uploaded to TestFlight.
#               Runs from the Actions tab ("Run workflow") or when a tag like ios-v0.5.0 is pushed.
#               Needs the signing secrets listed below. Artifact: "ios-ipa".
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   IOS_CERTIFICATE_P12_BASE64     Apple Distribution (or Development) certificate + private key,
#                                  exported from Keychain Access as .p12, then base64-encoded
#   IOS_CERTIFICATE_PASSWORD       the password chosen when exporting the .p12
#   IOS_PROVISIONING_PROFILE_BASE64  the .mobileprovision for com.healoo.app, base64-encoded
#   Optional, for TestFlight upload (App Store Connect → Users and Access → Integrations → Keys):
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_P8_BASE64
#   Optional, for push notifications: GOOGLE_SERVICE_INFO_PLIST_BASE64 (from Firebase)
# Variables (same page → Variables), optional; without HEALOO_API_BASE_URL the app runs in demo mode:
#   HEALOO_API_BASE_URL, HEALOO_AUTH0_DOMAIN, HEALOO_AUTH0_CLIENT_ID, HEALOO_AUTH0_AUDIENCE
name: Build macOS App

on:
  push:
    branches: [main]
    tags: ["ios-v*"]
    paths:
      - "WUI/ios/**"
      - "WUI/page-operations.json"
      - ".github/workflows/build-macos.yml"
  pull_request:
    paths:
      - "WUI/ios/**"
      - "WUI/page-operations.json"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the signed build to TestFlight (needs an App Store profile and the API key secrets)"
        type: boolean
        default: false

env:
  XCODE_VERSION: "16.4"

jobs:
  build-macos:
    # macos-13 runners were retired by GitHub (December 2025); macos-15 has Xcode 16.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "Xcode ${XCODE_VERSION} is not on this runner; using the default: $(xcode-select -p)"
          fi
          xcodebuild -version

      # The Xcode project is generated from WUI/ios/project.yml (it is not kept in git).
      - name: Generate Xcode Project
        working-directory: WUI/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compile with Xcodebuild
        working-directory: WUI/ios
        run: |
          set -o pipefail
          for configuration in Debug Release; do
            echo "::group::xcodebuild $configuration"
            xcodebuild build \
              -project Healoo.xcodeproj \
              -scheme "Healoo" \
              -configuration "$configuration" \
              -sdk iphonesimulator \
              -destination "generic/platform=iOS Simulator" \
              SYMROOT="$GITHUB_WORKSPACE/build" \
              CODE_SIGNING_ALLOWED=NO
            echo "::endgroup::"
          done
          # build/Debug-iphonesimulator/Healoo.app and build/Release-iphonesimulator/Healoo.app
          ls -la "$GITHUB_WORKSPACE/build"

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-executable
          path: build/
          if-no-files-found: error
          retention-days: 14

  build-device:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "Xcode ${XCODE_VERSION} is not on this runner; using the default: $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Install Certificate and Provisioning Profile
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=""
          [ -n "$CERTIFICATE_P12_BASE64" ] || missing="$missing IOS_CERTIFICATE_P12_BASE64"
          [ -n "$CERTIFICATE_PASSWORD" ] || missing="$missing IOS_CERTIFICATE_PASSWORD"
          [ -n "$PROFILE_BASE64" ] || missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Signing secrets are missing:$missing (see the top of .github/workflows/build-macos.yml)"
            exit 1
          fi

          # Certificate into a temporary keychain (deleted at the end of the job).
          KEYCHAIN_PATH="$RUNNER_TEMP/healoo-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          security list-keychain -d user -s "$KEYCHAIN_PATH" "${existing[@]}"
          rm "$RUNNER_TEMP/certificate.p12"

          # Profile: read its name, team and type, then install it where Xcode looks.
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          team=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          if /usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$RUNNER_TEMP/profile.plist" 2>/dev/null | grep -q true; then
            method=debugging; identity="Apple Development"
          elif /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$RUNNER_TEMP/profile.plist" > /dev/null 2>&1; then
            method=release-testing; identity="Apple Distribution"        # Ad Hoc: listed devices only
          elif /usr/libexec/PlistBuddy -c "Print :ProvisionsAllDevices" "$RUNNER_TEMP/profile.plist" > /dev/null 2>&1; then
            method=enterprise; identity="Apple Distribution"
          else
            method=app-store-connect; identity="Apple Distribution"      # App Store / TestFlight
          fi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"; cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"
          done
          rm "$RUNNER_TEMP/profile.mobileprovision"
          echo "Profile \"$name\" (team $team), export method $method"
          {
            echo "PROFILE_NAME=$name"
            echo "TEAM_ID=$team"
            echo "EXPORT_METHOD=$method"
            echo "SIGNING_IDENTITY=$identity"
          } >> "$GITHUB_ENV"

      - name: Add Firebase Configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > WUI/ios/Healoo/GoogleService-Info.plist
            echo "GoogleService-Info.plist added: push notifications enabled"
          else
            echo "No GOOGLE_SERVICE_INFO_PLIST_BASE64: the app builds without push notifications"
          fi

      # Signing settings for the Release build only, in a spec that includes project.yml, so the
      # checked-in project (and local Xcode builds) are unchanged.
      - name: Generate Signed Xcode Project
        working-directory: WUI/ios
        run: |
          brew install xcodegen
          cat > signing.yml <<EOF
          include:
            - project.yml
          targets:
            Healoo:
              settings:
                configs:
                  Release:
                    CODE_SIGN_STYLE: Manual
                    DEVELOPMENT_TEAM: "$TEAM_ID"
                    CODE_SIGN_IDENTITY: "$SIGNING_IDENTITY"
                    PROVISIONING_PROFILE_SPECIFIER: "$PROFILE_NAME"
                    CURRENT_PROJECT_VERSION: "$GITHUB_RUN_NUMBER"
          EOF
          xcodegen generate --spec signing.yml

      - name: Point the App at the Server
        working-directory: WUI/ios
        env:
          HEALOO_API_BASE_URL: ${{ vars.HEALOO_API_BASE_URL }}
          HEALOO_AUTH0_DOMAIN: ${{ vars.HEALOO_AUTH0_DOMAIN }}
          HEALOO_AUTH0_CLIENT_ID: ${{ vars.HEALOO_AUTH0_CLIENT_ID }}
          HEALOO_AUTH0_AUDIENCE: ${{ vars.HEALOO_AUTH0_AUDIENCE }}
        run: |
          plist=Healoo/Info.plist
          if [ -z "$HEALOO_API_BASE_URL" ]; then
            echo "::warning::HEALOO_API_BASE_URL is not set: this build runs on demo data"
            exit 0
          fi
          /usr/libexec/PlistBuddy -c "Set :HealooUseFakeData false" "$plist"
          /usr/libexec/PlistBuddy -c "Set :HealooAPIBaseURL $HEALOO_API_BASE_URL" "$plist"
          [ -z "$HEALOO_AUTH0_DOMAIN" ] || /usr/libexec/PlistBuddy -c "Set :HealooAuth0Domain $HEALOO_AUTH0_DOMAIN" "$plist"
          [ -z "$HEALOO_AUTH0_CLIENT_ID" ] || /usr/libexec/PlistBuddy -c "Set :HealooAuth0ClientId $HEALOO_AUTH0_CLIENT_ID" "$plist"
          [ -z "$HEALOO_AUTH0_AUDIENCE" ] || /usr/libexec/PlistBuddy -c "Set :HealooAuth0Audience $HEALOO_AUTH0_AUDIENCE" "$plist"
          echo "Server: $HEALOO_API_BASE_URL"

      - name: Archive for iPhone
        working-directory: WUI/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Healoo.xcodeproj \
            -scheme "Healoo" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Healoo.xcarchive"

      - name: Export .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGNING_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict><key>com.healoo.app</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Healoo.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build-device" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          # Symbols for reading crash reports.
          (cd "$RUNNER_TEMP/Healoo.xcarchive" && zip -qr "$GITHUB_WORKSPACE/build-device/Healoo-dSYMs.zip" dSYMs)
          ls -la "$GITHUB_WORKSPACE/build-device"

      - name: Upload Signed App
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build-device/
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        if: inputs.upload_to_testflight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          if [ "$EXPORT_METHOD" != app-store-connect ]; then
            echo "::error::TestFlight needs an App Store provisioning profile (this one is $EXPORT_METHOD)"; exit 1
          fi
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8_BASE64" ]; then
            echo "::error::Set APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APP_STORE_CONNECT_KEY_P8_BASE64"; exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --upload-app -t ios -f "$GITHUB_WORKSPACE"/build-device/*.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Remove Signing Material
        if: always()
        run: |
          [ -z "$KEYCHAIN_PATH" ] || security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision \
                "$HOME/.appstoreconnect/private_keys/"*.p8 \
                WUI/ios/Healoo/GoogleService-Info.plist
